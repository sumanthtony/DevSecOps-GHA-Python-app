
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Zero To Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 640px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            margin: 1rem 0 2rem;
            padding: 0.4rem 1.2rem;
            border: 1px solid #7b2ff7;
            border-radius: 999px;
            font-size: 0.9rem;
            color: #c4b5fd;
            letter-spacing: 0.05em;
        }
        .cards {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem 1.8rem;
            min-width: 150px;
            flex: 1;
        }
        .card span {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }
        .card strong {
            font-size: 1.25rem;
            color: #f9fafb;
        }
        .ci-banner {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            margin-top: 1.5rem;
            display: inline-block;
        }
        .ci-banner .stage {
            color: #00d2ff;
            font-weight: 600;
        }
        .ci-banner .tool {
            color: #c4b5fd;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Zero To Hero</h1>
        <div class="badge">Udaan Batch 11 (Elite batch)</div>
        <div class="cards">
            <div class="card">
                <span>Framework</span>
                <strong>Flask 3.1</strong>
            </div>
            <div class="card">
                <span>Runtime</span>
                <strong>Python 3.14</strong>
            </div>
            <div class="card">
                <span>Deploy</span>
                <strong>AWS ECS</strong>
            </div>
        </div>
        <div class="ci-banner">
            This page is <span class="stage">built</span>, <span class="stage">tested (link check)</span> and <span class="stage">deployed</span> with <span class="tool">GitHub Actions</span>
        </div>
    </div>
</body>
</html>
