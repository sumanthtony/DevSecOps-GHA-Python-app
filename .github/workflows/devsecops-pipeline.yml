name: DevSecOps End to End Pipeline

on:
  workflow_dispatch:

jobs:
  # CI (Continous Integration with Security Scanning)
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
    secrets: inherit

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  dockerfile-scan:
    uses: ./.github/workflows/docker-lint.yml

  # Build once all Security Scans are completed
  docker-build-push:
    needs: [code-quality, secrets-scan, dependency-scan, dockerfile-scan]
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit

  trivy:
    needs: [docker-build-push]
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit
