name: Python lint

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Building python linting with matrix for different environments
        default: dev
        type: choice
        required: true
        options:
          - dev
          - stag
          - prod
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python libraries and dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: flake8 app.py
