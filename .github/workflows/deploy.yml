name: Deploy flask app

on:
  # Workflow_run is used on triggering the events that only after one workflow is completed then only this current workflow should run, in these scenarios we use workflow_run
  workflow_run:
    workflows: ["Docker build & push"]
    types: completed
    branches:
      - main

jobs:
  deploy:
    env :
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
      DOCKER_TAG: ${{ github.event.workflow_run.head_sha }}  # written like this when workflow_run event used
    runs-on: self-hosted

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Deploy with docker compose
        run: docker compose down && docker compose up -d --build --force-recreate --pull always
