name: Docker build & push

on:
  workflow_call: 

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      #Buildx ACTION step is required only if we are using self-hosted runners, if we are using github-hosted runners it will be pre-installed in it so no need to add specifically in it
      #- name: Set up Docker Buildx
        #uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: | 
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:latest
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.sha }}
            
