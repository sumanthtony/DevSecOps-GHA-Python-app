# This will deploy safe, secure and tested app to Prod server

name: Deploy to Server

on:
  workflow_call:

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    env :
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
      DOCKER_TAG: ${{ github.sha }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        
      - name: SSH to Prod server & create a app folder
        uses: appleboy/ssh-action@v1
        with:
          username: ${{ secrets.SSH_USERNAME }}
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Starting Deployment"
            mkdir -p devops
            sudo apt-get update -y
            sudo apt-get install docker.io -y && sudo apt-get install docker-compose-v2 -y
            sudo usermod -aG docker $USER && sudo systemctl enable --now docker

      - name: Copy the docker-compose file
        uses: appleboy/scp-action@v1
        with:
          username: ${{ secrets.SSH_USERNAME }}
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.yml
          target: ~/devops

      - name: SSH to Prod server & run app folder
        uses: appleboy/ssh-action@v1
        with:
          username: ${{ secrets.SSH_USERNAME }}
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Running the app"
            export DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}
            export DOCKER_TAG=${{ github.sha }}
            echo "Running the app"
            # 1. Pipe token directly to docker login without enclosing in sg quotes
            echo "${{ secrets. DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USER }}" --password-stdin || echo "${{ secrets.DOCKERHUB_TOKEN }}" | sg docker -c "docker login -u \"${{ vars.DOCKERHUB_USER }}\" --password-stdin"
            
            # 2. Run compose under the docker group
            sg docker -c "cd ~/devops && docker compose down && docker compose up -d --build --force-recreate --pull always"
          
