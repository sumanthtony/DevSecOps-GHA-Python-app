# API keys, sensitive data, credentials
# Secret scan - GitLeaks
name: Secrets Scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Run GitLeaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #GitHub actions manages it, pass automatic token & give it to runner for code checking and for any secrets scanning
